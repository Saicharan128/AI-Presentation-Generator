<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generation Hub - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f1115 0%, #1a1c23 100%);
            font-family: 'Inter', sans-serif;
            color: rgba(255, 255, 255, 0.95);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
        }

        .auth-container {
            background: rgba(38, 40, 44, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 35px;
            backdrop-filter: blur(10px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            background: rgba(26, 28, 32, 0.5);
            border-radius: 6px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-button {
            flex: 1;
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .tab-button.active {
            background: rgba(59, 130, 246, 0.9);
            color: white;
        }

        .tab-button:hover:not(.active) {
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: rgba(26, 28, 32, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 12px 15px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-primary {
            display: block;
            width: 100%;
            background: rgba(59, 130, 246, 0.9);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 15px;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            background: rgba(59, 130, 246, 1);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .alert {
            margin-bottom: 20px;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .form-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        .protected-content {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .protected-content h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .protected-content p {
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: rgba(107, 114, 128, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-secondary:hover {
            background: rgba(107, 114, 128, 0.7);
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }

            .auth-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="auth-container">
            <div id="authSection">
                <div class="auth-header">
                    <h1>AI Generation Hub</h1>
                    <p id="authSubtitle">Sign in to continue</p>
                </div>

                <div class="auth-tabs">
                    <button class="tab-button active" onclick="switchTab('login')">Login</button>
                    <button class="tab-button" onclick="switchTab('register')">Register</button>
                </div>

                <div id="message" class="alert"></div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginEmail" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="loginEmail" name="email"
                            placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" name="password"
                            placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        <span class="loading" style="display: none;"></span>
                        <span class="button-text">Sign In</span>
                    </button>
                </form>

                <form id="registerForm" class="auth-form" style="display: none;">
                    <div class="form-group">
                        <label for="registerEmail" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="registerEmail" name="email"
                            placeholder="Enter your email" required>
                        <div class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="registerPassword" name="password"
                            placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        <span class="loading" style="display: none;"></span>
                        <span class="button-text">Create Account</span>
                    </button>
                </form>
            </div>

            <div id="protectedContent" class="protected-content">
                <h2>Welcome!</h2>
                <p id="userEmail">You are successfully authenticated.</p>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://atom-auth-prod.onrender.com';
        let currentToken = sessionStorage.getItem('userToken');

        // Check if user is already authenticated on page load
        window.addEventListener('load', () => {
            if (currentToken) {
                verifyAuthentication();
            }
        });

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Show/hide forms
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const subtitle = document.getElementById('authSubtitle');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                subtitle.textContent = 'Sign in to continue';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                subtitle.textContent = 'Join AI Generation Hub';
            }

            // Clear messages
            hideMessage();
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            setLoading(true, 'login');

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.authenticated) {
                    sessionStorage.setItem('userToken', data.token);
                    sessionStorage.setItem("userEmail", email);
                    currentToken = data.token;
                    showMessage('Login successful! Redirecting...', 'success');

                    // Redirect to Flask application after successful login
                    setTimeout(() => {
                        // Encode email and token safely in URL
                        const params = new URLSearchParams({
                            token: data.token,
                            email: email
                        });
                        window.location.href = `/atom_auth?${params.toString()}`;
                    }, 1000);
                } else {
                    showMessage(data.message || 'Login failed. Please check your credentials.', 'danger');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'danger');
            } finally {
                setLoading(false, 'login');
            }
        });

        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'danger');
                return;
            }

            setLoading(true, 'register');

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Registration successful! You can now log in.', 'success');
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginEmail').value = email;
                    }, 1500);
                } else {
                    showMessage(data.message || 'Registration failed. Please try again.', 'danger');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'danger');
            } finally {
                setLoading(false, 'register');
            }
        });

        async function verifyAuthentication() {
            try {
                const response = await fetch(`${API_BASE}/verify`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                const data = await response.json();

                if (response.ok && data.authenticated) {
                    // If already authenticated, redirect to Flask app
                    window.location.href = '/atom_auth';
                } else {
                    sessionStorage.removeItem('userToken');
                    currentToken = null;
                }
            } catch (error) {
                sessionStorage.removeItem('userToken');
                currentToken = null;
            }
        }

        function showProtectedContent(email) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('protectedContent').style.display = 'block';
            document.getElementById('userEmail').textContent = `Welcome, ${email}!`;
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
            } catch (error) {
                console.log('Logout request failed, but clearing local token anyway');
            }

            sessionStorage.removeItem('userToken');
            currentToken = null;

            document.getElementById('authSection').style.display = 'block';
            document.getElementById('protectedContent').style.display = 'none';

            // Reset forms
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();

            showMessage('You have been logged out successfully.', 'success');
        }

        function setLoading(loading, form) {
            const button = document.querySelector(`#${form}Form .btn-primary`);
            const loadingSpinner = button.querySelector('.loading');
            const buttonText = button.querySelector('.button-text');

            if (loading) {
                button.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                buttonText.textContent = 'Processing...';
            } else {
                button.disabled = false;
                loadingSpinner.style.display = 'none';
                buttonText.textContent = form === 'login' ? 'Sign In' : 'Create Account';
            }
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `alert alert-${type}`;
            messageEl.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }
    </script>
</body>

</html>
